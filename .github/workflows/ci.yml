name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/app
      - run: npm run check
      - run: npm run build:ui
      # `forge lint` is run locally before every deploy; it needs the Forge CLI and login.
