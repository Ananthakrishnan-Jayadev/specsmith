# SpecSmith - Atlassian Forge app
# Current state: Phase 0. Spike S1 (Rovo agent + action) and the main Custom UI page.
modules:
  confluence:globalPage:
    - key: specsmith-home
      title: SpecSmith
      route: specsmith
      resource: main
      resolver:
        function: resolver
  rovo:agent:
    - key: specsmith-ping-agent
      name: SpecSmith Ping
      description: Spike S1 - verifies that a SpecSmith Rovo agent can call a Forge action.
      prompt: >
        You are a connectivity test agent for the SpecSmith Forge app.

        When the user says "ping" (or asks you to test the connection), call the
        ping action, passing along any message the user gave.

        Reply with exactly what the action returned: the reply, the server time and
        the echoed message. If the action fails, say so and show the error. Never
        invent a response.
      conversationStarters:
        - ping
      actions:
        - ping
  rovo:mcp:
    - key: specsmith-mcp
      name: SpecSmith
      tools:
        - ping
  action:
    - key: ping
      name: Ping SpecSmith
      function: pingFunction
      actionVerb: GET
      description: >
        Connectivity test. Returns "pong", the server time and the optional message
        that was sent.
      inputs:
        message:
          title: Message
          type: string
          required: false
          description: Optional text to echo back.
  consumer:
    - key: specsmith-spike-consumer
      queue: specsmith-spike
      function: spikeConsumerFn
  function:
    - key: spikeConsumerFn
      handler: index.spikeConsumer
      timeoutSeconds: 900
    - key: pingFunction
      handler: index.ping
    - key: resolver
      handler: index.handler
permissions:
  scopes:
    # Each scope is the one the Confluence/Jira OpenAPI spec lists for an endpoint we call.
    - read:space:confluence      # GET /wiki/api/v2/spaces (find target space)
    - read:page:confluence       # GET /wiki/api/v2/pages (duplicate-title check), page properties
    - write:page:confluence      # POST/PUT /wiki/api/v2/pages, page properties
    - write:confluence-file      # PUT /wiki/rest/api/content/{id}/child/attachment (ERD, exports)
    - read:jira-work             # projects, create metadata, link types, transitions
    - write:jira-work            # create issues, issue links, remote links, transitions
    - storage:app                # Forge KVS (specs, run log)
resources:
  - key: main
    path: static/app/build
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/b52c7bfa-32ff-4522-9487-c57138769496
